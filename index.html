<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AdminExpress</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <section class="lado-azul">
            <h1>AdminExpress</h1>
        </section>

        <section class="lado-formulario">
            <div class="formulario">
                <h2>Let's <strong>Sign In</strong> 👇</h2>
                <p>Hey, Enter your details to get sign in<br>to your account.</p>

                <form>
                    <label for="email">Email</label>
                    <div class="campo">
                        <span>✉</span>
                        <input type="email" id="email" placeholder="Enter Email" required>
                    </div>

                    <label for="password">Password</label>
                    <div class="campo">
                        <span>🔒</span>
                        <input type="password" id="password" placeholder="Enter Password" required>
                    </div>

                    <a class="olvido" href="#">Forgot password?</a>
                    <button type="submit">Sign In</button>
                </form>

                <p class="registro">Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </section>
    </main>
</body>
</html>
